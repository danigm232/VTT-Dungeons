<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dungeons · Cargando</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#08191ded;color:#f2dfb9;font:15px system-ui;min-height:100dvh;display:grid;place-items:center}main{text-align:center;width:min(90vw,360px)}h1{font:24px Georgia}button,select{min-height:44px;border:1px solid #b59866;border-radius:6px;background:#203732;color:#f2dfb9;padding:8px 14px;font:inherit}#die{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);display:block;margin:0;width:76px;height:76px;padding:4px;background:transparent;border:0;font:bold 26px Georgia}svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px #dfad55)}#die.rolling svg{animation:roll 1.115s ease-out}#die:disabled{opacity:.65}#spinner{display:inline-block;width:20px;height:20px;border:2px solid #a38d6a44;border-top-color:#dcb678;border-radius:50%;animation:spin 1.2s linear infinite;vertical-align:middle;margin-right:8px}footer{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;width:100%;pointer-events:none}footer button{pointer-events:auto}small{display:block;color:#b9c8c0;margin:14px}#error{color:#efb0a0}#result{min-height:24px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes roll{0%{transform:translate(-20px,-12px) rotate3d(1,1,.2,0deg)}35%{transform:translate(24px,-36px) rotate3d(1,.7,.3,400deg)}65%{transform:translate(-8px,8px) rotate3d(.5,1,.2,700deg)}100%{transform:translate(0) rotate3d(0,0,1,1080deg)}}@media(prefers-reduced-motion:reduce){#spinner,#die.rolling svg{animation:none}}
</style><main><section id="join"><h1>Conecta tu personaje</h1><select id="character"><option value="mia">Mía</option><option value="maria">Trinity</option><option value="mike">Mike</option></select> <button id="connect">Entrar</button><small>Controles de carga · sesión local de Godot</small></section><section id="loading" hidden><p><i id="spinner"></i><span id="status">Cargando…</span></p><button id="die" aria-label="Lanzar d20 de práctica" hidden><svg viewBox="0 0 100 100"><path d="M50 3 94 30 85 78 50 98 15 78 6 30Z M50 3 27 33 73 33 50 3 M6 30 27 33 15 78 50 68 85 78 73 33 94 30 M27 33 50 68 73 33 M15 78 50 98 85 78 M50 68 50 98" fill="#7d5c2422" stroke="#e1bc76" stroke-width="1.5"/><text x="50" y="58" text-anchor="middle" fill="#ffe3a6" font-size="26" id="face">20</text></svg></button><p id="result"></p><footer><button id="continue" hidden>Continuar</button></footer></section><p id="error" role="alert"></p></main>
<script src="/die.js"></script><script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('godot-loading-token')||'',state={},rolling=false,lastEntry='',lastRoll='';
fetch('/roster').then(r=>r.json()).then(rows=>$('#character').replaceChildren(...rows.map(row=>new Option(row.label,row.id))));
async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,token})});const value=await r.json();if(!r.ok)throw Error(value.error||'Acción no disponible');return value}
function paint(s){state=s;if(s.entry!==lastEntry){lastEntry=s.entry;lastRoll='';$('#result').textContent='';$('#face').textContent='20'}$('#join').hidden=true;$('#loading').hidden=false;$('#die').hidden=!s.participants.includes(s.character);$('#die').disabled=!s.canRoll||rolling;$('#continue').hidden=!s.ready||!s.visible;$('#continue').disabled=!!s.continued;$('#continue').textContent=s.continued?'Esperando al grupo…':'Continuar';$('#spinner').hidden=s.ready;$('#status').textContent=!s.visible?'Mapa listo':s.continued?'Esperando al grupo…':s.ready?'Mapa preparado':'Cargando…';if(s.roll.natural&&!rolling){$('#face').textContent=s.roll.natural;if(lastRoll!==s.entry){lastRoll=s.entry;$('#result').textContent='Resultado · '+s.roll.total;setTimeout(()=>$('#result').textContent='',3000)}}if(!s.visible){$('#die').hidden=true;$('#result').textContent=''}}
$('#connect').onclick=async()=>{try{const v=await post('/join',{character:$('#character').value});token=v.token;localStorage.setItem('godot-loading-token',token);await post('/ready');paint(v.state);$('#error').textContent=''}catch(e){$('#error').textContent=e.message}};
$('#die').onclick=async()=>{if(rolling||!state.canRoll)return;rolling=true;$('#die').disabled=true;$('#die').classList.add('rolling');const timer=setInterval(()=>$('#face').textContent=1+Math.floor(Math.random()*20),45);try{await post('/roll',{entry:state.entry});await window.godotDieRoll();rolling=false;paint(await(await fetch('/state?token='+encodeURIComponent(token))).json())}catch(e){$('#error').textContent=e.message;rolling=false}finally{clearInterval(timer);$('#die').classList.remove('rolling');if(state.roll.natural)$('#face').textContent=state.roll.natural}};
$('#continue').onclick=async()=>{try{paint((await post('/continue',{entry:state.entry})).state)}catch(e){$('#error').textContent=e.message}};
setInterval(async()=>{if(!token)return;try{const r=await fetch('/state?token='+encodeURIComponent(token));if(r.status===401){token='';$('#join').hidden=false;$('#loading').hidden=true;return}paint(await r.json());$('#error').textContent=''}catch(e){$('#error').textContent='Reconectando con Godot…'}},500);
</script></html>
