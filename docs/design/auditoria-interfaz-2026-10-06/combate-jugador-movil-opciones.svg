<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1280" viewBox="0 0 2000 1280" role="img" aria-labelledby="title desc">
  <title id="title">Combate del jugador en móvil: dos propuestas de interfaz</title>
  <desc id="desc">Comparativa entre un HUD táctico compacto y una bandeja de turno desplegable sobre el mapa.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142526"/><stop offset="1" stop-color="#091315"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#183738"/><stop offset="1" stop-color="#101e20"/></linearGradient>
    <linearGradient id="sheet" x2="0" y2="1"><stop stop-color="#253638"/><stop offset="1" stop-color="#182527"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#d9dfc1" stroke-opacity=".35" stroke-width="1.5"/></pattern>
    <pattern id="terrain" width="168" height="126" patternUnits="userSpaceOnUse"><rect width="168" height="126" fill="#52614c"/><path d="M0 90L38 63l23 20 36-49 40 36 31-31v87H0Z" fill="#3f5143"/><path d="M8 12l27 9-8 13-25-5m104 64 28-18 14 15-25 18" fill="#758065" opacity=".65"/><circle cx="74" cy="34" r="9" fill="#294039"/><circle cx="78" cy="30" r="5" fill="#64814e"/><circle cx="151" cy="107" r="12" fill="#314039"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
    <style>
      .title{font:700 40px Arial,sans-serif;fill:#f0dfb7}.sub{font:20px Arial,sans-serif;fill:#b5c0b7}.label{font:700 26px Arial,sans-serif;fill:#f0dfb7}.body{font:18px Arial,sans-serif;fill:#d4dbd0}.small{font:15px Arial,sans-serif;fill:#bac5bc}.tiny{font:12px Arial,sans-serif;fill:#d4dbd0}.stat{font:700 15px Arial,sans-serif;fill:#f0dfb7}.gold{fill:#dfbd75}.muted{fill:#9aa9a4}
    </style>
  </defs>
  <rect width="2000" height="1280" fill="url(#bg)"/>
  <text class="title" x="70" y="72">Combate del jugador · móvil</text>
  <text class="sub" x="70" y="109">Dos jerarquías para móvil vertical: conservar el mapa y dejar claro qué puede hacer Mike.</text>

  <g transform="translate(70 155)">
    <text class="label" x="0" y="0">A · HUD táctico compacto</text>
    <text class="small" x="0" y="30">Todo el turno visible; acciones siempre a un toque.</text>
    <g transform="translate(25 65)" filter="url(#shadow)">
      <rect width="620" height="1010" rx="38" fill="#05090a" stroke="#677a76" stroke-width="3"/>
      <rect x="16" y="16" width="588" height="978" rx="27" fill="url(#screen)"/>
      <rect x="236" y="25" width="148" height="8" rx="4" fill="#53635f"/>
      <rect x="31" y="52" width="558" height="82" rx="15" fill="#142324" stroke="#536764"/>
      <circle cx="75" cy="93" r="25" fill="#315e72" stroke="#8eb3c0" stroke-width="3"/>
      <text class="stat" x="113" y="82">MIKE · GUERRERO</text><text class="small" x="113" y="108">PG 18/24 · CA 16</text>
      <rect x="422" y="68" width="145" height="46" rx="12" fill="#2e3c35"/><text class="stat" x="445" y="96">TU TURNO</text>
      <rect x="31" y="148" width="558" height="65" rx="14" fill="#202f30" stroke="#465b58"/>
      <text class="tiny gold" x="48" y="174">ORDEN DE INICIATIVA</text>
      <g font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">
        <circle cx="79" cy="190" r="15" fill="#277cb0"/><text x="79" y="195" fill="#fff">M</text>
        <circle cx="132" cy="190" r="15" fill="#833f37"/><text x="132" y="195" fill="#fff">H</text>
        <circle cx="185" cy="190" r="15" fill="#833f37"/><text x="185" y="195" fill="#fff">S</text>
        <circle cx="238" cy="190" r="15" fill="#277cb0"/><text x="238" y="195" fill="#fff">L</text>
      </g>
      <rect x="31" y="226" width="558" height="500" rx="16" fill="url(#terrain)" stroke="#6b7869"/>
      <rect x="31" y="226" width="558" height="500" rx="16" fill="url(#grid)"/>
      <path d="M31 603c75-43 110-15 150 15v108H31zm558-207c-68 12-79 62-92 115l92 27z" fill="#186478" opacity=".88"/>
      <path d="M31 603c75-43 110-15 150 15" fill="none" stroke="#b4d5c4" stroke-width="4" opacity=".75"/>
      <g transform="translate(271 492)"><ellipse cy="27" rx="31" ry="12" fill="#1c8fca" stroke="#8de1ff" stroke-width="4"/><path d="M-15 11l-6-30 17-19 23 14 8 35-12 14h-24z" fill="#244d6b" stroke="#c3d1cb" stroke-width="3"/><path d="M-12-21l8-19 20 8 5 16-16 6z" fill="#af8957" stroke="#271e1c" stroke-width="3"/><path d="M15-8l24-26 6 3-11 35" fill="none" stroke="#d6d9d0" stroke-width="6"/></g>
      <g transform="translate(442 375)"><ellipse cy="18" rx="27" ry="11" fill="#9a473d" stroke="#e8886c" stroke-width="3"/><path d="M-14 7l-6-22 14-14 21 10 7 24z" fill="#8a4936" stroke="#171817" stroke-width="3"/><path d="M-9-26l9-12 14 8 2 11-13 2z" fill="#769254" stroke="#25241c" stroke-width="3"/></g>
      <rect x="48" y="666" width="184" height="43" rx="11" fill="#131f20" fill-opacity=".91"/><text class="tiny" x="63" y="693">Alcance 30 pies</text>
      <rect x="31" y="742" width="558" height="104" rx="17" fill="#192829" stroke="#55645d"/>
      <text class="tiny gold" x="49" y="768">RECURSOS DE TURNO</text>
      <g><rect x="47" y="781" width="164" height="48" rx="12" fill="#283b38"/><text class="stat" x="66" y="811">MOVIMIENTO ✓</text><rect x="220" y="781" width="164" height="48" rx="12" fill="#283b38"/><text class="stat" x="241" y="811">ACCIÓN ●</text><rect x="393" y="781" width="178" height="48" rx="12" fill="#283b38"/><text class="stat" x="410" y="811">BONUS · REAC.</text></g>
      <rect x="31" y="861" width="558" height="111" rx="17" fill="#142223" stroke="#455a56"/>
      <rect x="47" y="877" width="156" height="76" rx="15" fill="#294849" stroke="#69827b"/><text class="stat" x="79" y="908">MOVER</text><text class="tiny" x="69" y="933">toca casilla</text>
      <rect x="214" y="877" width="156" height="76" rx="15" fill="#4c3b28" stroke="#b39661"/><text class="stat" x="253" y="908">ATACAR</text><text class="tiny" x="236" y="933">elige objetivo</text>
      <rect x="381" y="877" width="190" height="76" rx="15" fill="#5c3d35" stroke="#c4876b"/><text class="stat" x="408" y="908">TERMINAR</text><text class="tiny" x="406" y="933">turno de Mike</text>
    </g>
    <text class="small" x="25" y="1110">A favor: el turno se entiende de un vistazo.</text><text class="small" x="25" y="1134">A revisar: consume altura y puede tapar terreno.</text>
  </g>

  <g transform="translate(1015 155)">
    <text class="label" x="0" y="0">B · Mapa primero + bandeja</text>
    <text class="small" x="0" y="30">HUD mínimo; la bandeja aparece al tocar la acción.</text>
    <g transform="translate(25 65)" filter="url(#shadow)">
      <rect width="620" height="1010" rx="38" fill="#05090a" stroke="#677a76" stroke-width="3"/>
      <rect x="16" y="16" width="588" height="978" rx="27" fill="url(#screen)"/>
      <rect x="236" y="25" width="148" height="8" rx="4" fill="#53635f"/>
      <rect x="31" y="52" width="558" height="68" rx="15" fill="#142324" fill-opacity=".96" stroke="#536764"/>
      <circle cx="70" cy="86" r="22" fill="#315e72" stroke="#8eb3c0" stroke-width="3"/>
      <text class="stat" x="105" y="80">MIKE · PG 18/24</text><text class="tiny" x="105" y="103">CA 16 · TU TURNO</text>
      <rect x="439" y="64" width="132" height="41" rx="12" fill="#202f30"/><text class="tiny gold" x="458" y="90">RONDA 2</text>
      <rect x="31" y="134" width="558" height="52" rx="13" fill="#202f30" stroke="#465b58"/>
      <g font-family="Arial" font-size="13" font-weight="700" text-anchor="middle"><circle cx="76" cy="160" r="16" fill="#277cb0"/><text x="76" y="165" fill="#fff">M</text><circle cx="135" cy="160" r="16" fill="#833f37"/><text x="135" y="165" fill="#fff">H</text><circle cx="194" cy="160" r="16" fill="#833f37"/><text x="194" y="165" fill="#fff">S</text><circle cx="253" cy="160" r="16" fill="#277cb0"/><text x="253" y="165" fill="#fff">L</text></g><text class="tiny" x="305" y="165">Turno de Mike</text>
      <rect x="31" y="200" width="558" height="604" rx="16" fill="url(#terrain)" stroke="#6b7869"/><rect x="31" y="200" width="558" height="604" rx="16" fill="url(#grid)"/>
      <path d="M31 650c93-55 128-15 181 6v132H31zm558-230c-73 6-78 73-106 118l106 44z" fill="#186478" opacity=".88"/><path d="M31 650c93-55 128-15 181 6" fill="none" stroke="#b4d5c4" stroke-width="4" opacity=".75"/>
      <g transform="translate(268 477)"><ellipse cy="28" rx="31" ry="12" fill="#1c8fca" stroke="#8de1ff" stroke-width="4"/><path d="M-15 11l-6-30 17-19 23 14 8 35-12 14h-24z" fill="#244d6b" stroke="#c3d1cb" stroke-width="3"/><path d="M-12-21l8-19 20 8 5 16-16 6z" fill="#af8957" stroke="#271e1c" stroke-width="3"/><path d="M15-8l24-26 6 3-11 35" fill="none" stroke="#d6d9d0" stroke-width="6"/></g>
      <g transform="translate(443 359)"><ellipse cy="18" rx="27" ry="11" fill="#9a473d" stroke="#e8886c" stroke-width="3"/><path d="M-14 7l-6-22 14-14 21 10 7 24z" fill="#8a4936" stroke="#171817" stroke-width="3"/><path d="M-9-26l9-12 14 8 2 11-13 2z" fill="#769254" stroke="#25241c" stroke-width="3"/></g>
      <rect x="48" y="739" width="184" height="43" rx="11" fill="#131f20" fill-opacity=".91"/><text class="tiny" x="63" y="766">Movimiento 30 pies</text>
      <rect x="31" y="820" width="558" height="152" rx="23" fill="url(#sheet)" stroke="#74827a" stroke-width="2"/>
      <rect x="274" y="830" width="72" height="6" rx="3" fill="#778681"/>
      <text class="tiny gold" x="50" y="863">TU TURNO · ELIGE QUÉ HACER</text>
      <g><rect x="47" y="878" width="124" height="45" rx="12" fill="#294849" stroke="#69827b"/><text class="stat" x="78" y="907">MOVER</text><rect x="182" y="878" width="124" height="45" rx="12" fill="#4c3b28" stroke="#b39661"/><text class="stat" x="216" y="907">ACCIÓN</text><rect x="317" y="878" width="124" height="45" rx="12" fill="#283b38"/><text class="stat" x="338" y="907">BONUS</text><rect x="452" y="878" width="120" height="45" rx="12" fill="#283b38"/><text class="stat" x="472" y="907">REAC.</text></g>
      <text class="tiny" x="51" y="950">Atacar a Arpia</text><text class="tiny gold" x="388" y="950">Tira en mesa · anota el total</text>
    </g>
    <text class="small" x="25" y="1110">A favor: más tablero libre y controles por contexto.</text><text class="small" x="25" y="1134">A revisar: la bandeja no debe ocultar al objetivo.</text>
  </g>
  <text class="tiny muted" x="70" y="1245">Conceptos de auditoría, no capturas de la aplicación. Mantienen dados y decisiones en la mesa.</text>
</svg>
