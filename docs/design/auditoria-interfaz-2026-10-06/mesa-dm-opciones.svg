<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1040" viewBox="0 0 2000 1040" role="img" aria-labelledby="title desc">
  <title id="title">Opciones de diseño para la mesa del DM</title>
  <desc id="desc">Comparación de una mesa con inspector contextual fijo y una mesa con el mapa como protagonista y controles en una bandeja inferior.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#14252a"/><stop offset="1" stop-color="#071013"/></linearGradient>
    <linearGradient id="bar" x2="1"><stop stop-color="#233b3d"/><stop offset="1" stop-color="#101d21"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#69755c"/><path d="M34 0H0V34" fill="none" stroke="#d4d4aa" stroke-opacity=".45" stroke-width="1"/><path d="M3 5h8v4H3zm17 13h6v8h-6z" fill="#87906e" opacity=".6"/></pattern>
    <pattern id="water" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#1d6973"/><path d="M3 10q6-4 12 0t12 0M-3 28q6-4 12 0t12 0" fill="none" stroke="#71c1bd" stroke-opacity=".55" stroke-width="2"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e9e5d8}.title{font-size:34px;font-weight:700;letter-spacing:.03em}.sub{font-size:17px;fill:#aab9b6}.label{font-size:13px;fill:#9eb3af;letter-spacing:.12em;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#afbfbb}.gold{fill:#f1d895}.mint{fill:#83d3aa}.cyan{fill:#92d5d9}.panel{fill:#101d20;stroke:#365258;stroke-width:1.5}.line{stroke:#345057;stroke-width:1}.btn{fill:#20373b;stroke:#536f70;stroke-width:1}.strong{fill:#bb9145;stroke:#e3c77a;stroke-width:1.5}.tokenBlue{fill:#276eaa;stroke:#8bd2ff;stroke-width:3}.tokenRed{fill:#8a353d;stroke:#ffb0a1;stroke-width:3}.tokenGreen{fill:#4b7a53;stroke:#b7ecab;stroke-width:3}
    </style>
  </defs>
  <rect width="2000" height="1040" fill="#080f12"/>
  <text x="60" y="58" class="title">MESA DEL DM</text><text x="60" y="88" class="sub">Dos formas de reducir paneles y mantener la escena táctica siempre a la vista</text>
  <g transform="translate(45 120)">
    <rect width="930" height="865" rx="18" fill="#0c171a" stroke="#476267" stroke-width="2"/>
    <text x="24" y="35" class="label gold">OPCIÓN A · INSPECTOR CONTEXTUAL</text><text x="24" y="60" class="small">Mapa grande; las herramientas aparecen junto al elemento seleccionado.</text>
    <g transform="translate(18 82)" filter="url(#shadow)">
      <rect width="894" height="752" rx="12" fill="#0a1417" stroke="#405b60"/>
      <rect width="894" height="53" rx="12" fill="url(#bar)"/><path d="M0 53H894" class="line"/>
      <text x="20" y="23" class="label gold">D&amp;D · STORMWRECK ISLE</text><text x="20" y="42" class="small">Mesa del DM</text>
      <rect x="532" y="12" width="105" height="29" rx="14" fill="#163a2f" stroke="#3e8b69"/><circle cx="548" cy="26" r="4" fill="#8de1ae"/><text x="560" y="31" class="small mint">3 conectados</text>
      <rect x="650" y="12" width="124" height="29" rx="14" fill="#17353a" stroke="#41666c"/><circle cx="666" cy="26" r="4" fill="#8de1d4"/><text x="678" y="31" class="small cyan">Proyector listo</text>
      <circle cx="840" cy="26" r="15" fill="#172a2d" stroke="#536d6d"/><text x="835" y="32" class="body">⋯</text>
      <rect x="0" y="53" width="52" height="699" fill="#0d191c"/><path d="M52 53V752" class="line"/>
      <g class="small" text-anchor="middle"><circle cx="26" cy="88" r="16" fill="#263e40" stroke="#a88a4c"/><text x="26" y="94" class="body gold">⌖</text><text x="26" y="122" font-size="10">Mapa</text><circle cx="26" cy="158" r="14" fill="#17292c"/><text x="26" y="164">♟</text><circle cx="26" cy="218" r="14" fill="#17292c"/><text x="26" y="224">▣</text><circle cx="26" cy="278" r="14" fill="#17292c"/><text x="26" y="284">☼</text><circle cx="26" cy="338" r="14" fill="#17292c"/><text x="26" y="344">♫</text></g>
