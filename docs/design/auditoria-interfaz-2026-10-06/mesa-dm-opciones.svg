      <g transform="translate(438 337) rotate(-14)"><path d="M0 17l148-16-8 38L11 47z" fill="#744d35" stroke="#d7b47a" stroke-width="4"/><path d="M19 18l8 25m24-28 7 24m26-27 5 23m27-26 1 22" stroke="#c29356" stroke-width="4"/><path d="M15 15l59-43 49 33" fill="none" stroke="#9b7548" stroke-width="6"/></g>
      <g><circle cx="297" cy="282" r="17" class="tokenBlue"/><text x="292" y="287" font-size="10" font-weight="700">MI</text><circle cx="506" cy="435" r="17" class="tokenGreen"/><text x="501" y="440" font-size="10" font-weight="700">MA</text><circle cx="728" cy="310" r="17" class="tokenRed"/><text x="723" y="315" font-size="10" font-weight="700">PN</text></g>
      <rect x="28" y="80" width="202" height="42" rx="8" fill="#071416e8" stroke="#91a69a"/><text x="42" y="99" class="label">CALA DEL NAUFRAGIO</text><text x="42" y="114" class="small">Vista táctica · 1 casilla = 1,5 m</text>
      <g transform="translate(770 78)"><rect width="92" height="238" rx="12" fill="#0a181bde" stroke="#4b6666"/><circle cx="46" cy="37" r="23" fill="#19363a" stroke="#718889"/><text x="40" y="44" class="body gold">☼</text><circle cx="46" cy="99" r="23" fill="#19363a" stroke="#718889"/><text x="40" y="106" class="body gold">♟</text><circle cx="46" cy="161" r="23" fill="#19363a" stroke="#718889"/><text x="40" y="168" class="body gold">▣</text><circle cx="46" cy="219" r="18" fill="#bb9145" stroke="#e3c77a"/><text x="40" y="225" class="body">↶</text></g>
      <rect x="14" y="652" width="866" height="84" rx="10" fill="#0d1b1e" stroke="#49656a"/>
      <text x="30" y="674" class="label">MESA · 3 EN ESCENA</text><circle cx="56" cy="708" r="17" class="tokenBlue"/><text x="51" y="713" font-size="10" font-weight="700">MI</text><text x="81" y="704" class="body">Mike</text><text x="81" y="723" class="small">18/22 PG</text><circle cx="220" cy="708" r="17" class="tokenGreen"/><text x="215" y="713" font-size="10" font-weight="700">MA</text><text x="245" y="704" class="body">Maria</text><text x="245" y="723" class="small">22/22 PG</text><rect x="584" y="669" width="126" height="52" rx="8" class="btn"/><text x="604" y="691" class="small">Escena</text><text x="604" y="710" class="body">Cala ▾</text><rect x="724" y="669" width="138" height="52" rx="8" class="strong"/><text x="745" y="701" class="body gold">Abrir panel  ☰</text>
    </g>
    <text x="28" y="855" class="small">Ventaja: máxima lectura del tablero y menos elementos permanentes.</text><text x="28" y="875" class="small">Auditar: localizar edición avanzada dentro del panel plegable.</text>
  </g>
</svg>
