      <path d="M644 178H856" class="line"/><text x="644" y="202" class="label">PERSONAJES</text>
      <rect x="644" y="216" width="210" height="57" rx="8" fill="#18302d" stroke="#4d795d"/><circle cx="665" cy="244" r="13" class="tokenBlue"/><text x="688" y="240" class="body">Mike</text><text x="688" y="259" class="small">18 / 22 PG</text><rect x="644" y="281" width="210" height="52" rx="8" fill="#142326" stroke="#334e51"/><circle cx="665" cy="307" r="12" class="tokenGreen"/><text x="688" y="304" class="body">Maria</text><text x="688" y="321" class="small">22 / 22 PG</text>
      <text x="644" y="365" class="label">HERRAMIENTAS</text><rect x="644" y="378" width="100" height="38" rx="7" class="strong"/><text x="661" y="402" class="small gold">Mover</text><rect x="754" y="378" width="100" height="38" rx="7" class="btn"/><text x="765" y="402" class="small">Ocultar</text>
      <rect x="644" y="428" width="210" height="65" rx="8" fill="#132326" stroke="#334e51"/><text x="658" y="450" class="label">CLIMA</text><text x="658" y="477" class="body">Nublado · Viento suave</text>
      <rect x="644" y="509" width="210" height="44" rx="8" class="btn"/><text x="660" y="536" class="small">Ver interacciones</text>
      <rect x="644" y="567" width="210" height="40" rx="8" fill="#382f1d" stroke="#9a7b3f"/><text x="660" y="592" class="small gold">Deshacer última acción</text>
      <rect x="64" y="696" width="812" height="42" rx="8" fill="#111f22" stroke="#334f54"/><text x="82" y="722" class="small">MAPA</text><text x="172" y="722" class="small">Jugadores  3</text><text x="330" y="722" class="small">Encuentro</text><text x="465" y="722" class="small">Objetos</text><text x="580" y="722" class="small">Cámara</text><text x="752" y="722" class="small gold">＋ Herramientas</text>
    </g>
    <text x="28" y="855" class="small">Ventaja: controles a la vista y ligados a la selección.</text><text x="28" y="875" class="small">Auditar: ancho del panel y altura disponible para el mapa.</text>
  </g>
  <g transform="translate(1025 120)">
    <rect width="930" height="865" rx="18" fill="#0c171a" stroke="#476267" stroke-width="2"/>
    <text x="24" y="35" class="label gold">OPCIÓN B · MAPA PROTAGONISTA</text><text x="24" y="60" class="small">Mapa casi completo; selección y herramientas viven en una bandeja plegable.</text>
