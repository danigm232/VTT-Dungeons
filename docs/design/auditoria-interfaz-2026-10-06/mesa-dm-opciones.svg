      <g><circle cx="273" cy="281" r="15" class="tokenBlue"/><text x="268" y="286" font-size="10" font-weight="700">MI</text><circle cx="407" cy="383" r="15" class="tokenGreen"/><text x="402" y="388" font-size="10" font-weight="700">MA</text><circle cx="532" cy="270" r="15" class="tokenRed"/><text x="527" y="275" font-size="10" font-weight="700">PN</text></g>
      <rect x="76" y="77" width="168" height="38" rx="7" fill="#071416dd" stroke="#91a69a"/><text x="90" y="94" class="label">CALA DEL NAUFRAGIO</text><text x="90" y="108" class="small">Cuadrícula · vista táctica</text>
      <g transform="translate(76 625)"><rect width="320" height="43" rx="8" fill="#0a181bde" stroke="#4b6666"/><text x="15" y="18" class="label">SELECCIÓN</text><text x="15" y="35" class="small">Mike · 18/22 PG · casilla C4</text><rect x="248" y="8" width="60" height="27" rx="6" class="btn"/><text x="258" y="27" class="small">Ficha</text></g>
