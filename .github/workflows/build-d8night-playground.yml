name: Build D8 Night Playground JSON

on:
  push:
    branches: [main]
    paths:
      - "campaigns/one-shot/playground/index.ts"
      - "campaigns/one-shot/playground/d8night.config.ts"
      - "campaigns/one-shot/playground/VERSION"
      - "campaigns/one-shot/playground/generate-playground-json.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Archive previous Playground versions
        run: |
          VERSION=$(cat campaigns/one-shot/playground/VERSION | tr -d '\n\r ')
          ROOT="campaigns/one-shot/playground"
          HISTORY="$ROOT/historico"
          mkdir -p "$HISTORY"

          shopt -s nullglob
          for FILE in "$ROOT"/playground_v*.json; do
            NAME=$(basename "$FILE")
            if [ "$NAME" != "playground_v${VERSION}.json" ]; then
              mv "$FILE" "$HISTORY/$NAME"
            fi
          done

      - name: Generate current Playground JSON
        run: node campaigns/one-shot/playground/generate-playground-json.mjs

      - name: Commit current and historical versions
        run: |
          VERSION=$(cat campaigns/one-shot/playground/VERSION | tr -d '\n\r ')
          ROOT="campaigns/one-shot/playground"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$ROOT"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build D8 Night Playground v${VERSION}"
          git push
