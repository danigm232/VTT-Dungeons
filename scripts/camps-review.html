<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campamentos · revisión artística</title><style>html,body{margin:0;background:#111b20;color:#e6dfcc;font:14px system-ui}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;gap:10px;align-items:center;padding:12px;flex-wrap:wrap;flex:none}select,button{background:#24343a;color:#e6dfcc;border:1px solid #65706a;border-radius:5px;padding:8px}button{cursor:pointer}canvas{width:100%;height:0;min-height:0;flex:1;display:block}#stats{margin-left:auto}</style></head><body><header><select id="camp" aria-label="Campamento"></select><select id="phase" aria-label="Fase"><option value="arrival">Día</option><option value="dusk">Anochecer</option><option value="night">Noche</option><option value="dawn">Amanecer</option></select><select id="focus" aria-label="Interior"><option value="">Exterior</option></select><select id="weather" aria-label="Clima"><option value="none">Seco</option><option value="rain1">Lluvia débil</option><option value="rain2">Lluvia media</option><option value="rain3">Lluvia fuerte</option><option value="snow1">Nieve débil</option><option value="snow2">Nieve media</option><option value="snow3">Nieve fuerte</option></select><select id="sea" aria-label="Oleaje"><option value="auto">Mar de escena</option><option value="0">Calma</option><option value=".4">Oleaje suave</option><option value="1">Temporal</option></select><button id="weatherAdvance">Adelantar 60 s de clima</button><button id="tendFire">Avivar (prueba visual)</button><button id="rotate">Girar 45°</button><button id="marks">Marcas</button><label><input id="shadows" type="checkbox" checked> Sombras</label><label><input id="actors" type="checkbox" checked> Personaje</label><button id="actorCheck">Diagnosticar personaje</button><button id="capture">Capturar</button><button id="audit">Auditar vistas</button><button id="auditAll">Auditar cin
