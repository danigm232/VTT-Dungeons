<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pecio · luz, reflejos y clima</title><style>
*{box-sizing:border-box}body{margin:0;background:#15252c;color:#e5dfcb;font:14px system-ui}header{height:180px;padding:10px;display:flex;align-content:center;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:10}button,select,input[type=number]{background:#30434b;color:inherit;border:1px solid #7b8577;padding:8px;border-radius:4px}input[type=number]{width:70px}#world{position:relative;height:calc(100vh - 212px);overflow:hidden}canvas{position:absolute}#status{height:32px;padding:6px}
</style></head><body><header>
<strong>Pecio · revisión real</strong><button id="left">Girar izquierda</button><button id="right">Girar derecha</button><button id="closer">Acercar</button><button id="farther">Alejar</button><button id="overview">Conjunto</button>
<select id="location" aria-label="Zona"><option value="main">C1</option><option value="c2">Cubierta C2</option><option value="c3">Cubierta C3</option><option value="c4">C4 · Capitán</option><option value="c5">C5 · Cocina</option><option value="c6">C6 · Tripulación</option><option value="c7">C7 · Comedor</option><option value="crow">Cofia</option><option value="lower-deck">C8</option><option value="hold-air">C9</option><option value="breach">Brecha de popa · P16</option><option value="bones">Huesos de dragón</option><option value="boat">Barca</option></select><button id="focus">Ver zona</button>
<label>Inclinación <select id="scenic-tilt" aria-label="Inclinación"><option>5</option><option>10</option><option>15</option><option>20</option><option selected>25</option></select>°</label>
<label><input id="carried-light" type="checkbox" checked>Luz del personaje</label><label><input id="night" type="checkbox">Noche</label>
<label><input id="reflections" type="checkbox" checked>Reflejos de objetos</label>
<label>Clima <select id="precipitation" aria-label="Precipitación"><option value="none">Seco</option><option value="rain">Lluvia</option><option value="snow">Nieve</option></select></label>
<label>Intensidad <select id="weather-level" aria-label="Intensidad"><option value="1">Débil</option><option value="2">Media</option><option value="3">Fuerte</option></select></label>
<label>Horas <input id="weather-hours" type="number" min="0" max="12" value="1" aria-label="Horas de clima"></label><button id="apply-weather">Aplicar clima de prueba</button><button id="capture">Guardar vista</button>
<label><input id="dense-fog" type="checkbox">Niebla densa de prueba</label>
<button id="sight-audit">Comprobar oclusión y rendimiento</button>
<button id="refine-audit">Comprobar proporciones y paja</button>
<button id="nest-audit">Revisar solo nido</button><label><input id="nest-looted" type="checkbox">Tesoro del nido recogido (prueba)</label>
<button id="audit">Auditar y guardar vistas</button><button id="replay">Ver recorrido comprobado</button><button id="replay-climb">Ver escalada comprobada</button>
</header><div id="world"></div><div id="status">Cargando…</div><script type="module" src="/scripts/wreck-review.ts"></script></body></html>
